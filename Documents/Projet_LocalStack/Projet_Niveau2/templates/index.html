<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cloud Storage Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#0f172a;
            color:white;
        }

        .drop-zone{
            border:3px dashed #3b82f6;
            padding:50px;
            text-align:center;
            border-radius:20px;
            background:#1e293b;
            transition:0.3s;
        }

        .drop-zone:hover{
            background:#334155;
        }

        .file-card{
            background:#1e293b;
            border-radius:15px;
            padding:15px;
            margin-bottom:20px;
        }

        img{
            max-width:100%;
            border-radius:10px;
        }

    </style>

</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-5">
        Flask Cloud Dashboard
    </h1>

    <form
        action="/upload"
        method="POST"
        enctype="multipart/form-data"
    >

        <div class="drop-zone mb-4">

            <h3>Drag & Drop Files</h3>

            <input
                type="file"
                name="file"
                multiple
                class="form-control mt-3"
            >

            <button class="btn btn-primary mt-4">
                Upload to S3
            </button>

        </div>

    </form>

    <div class="row">

        {% for file in files %}

        <div class="col-md-4">

            <div class="file-card">

                <h5>{{ file.name }}</h5>

                {% if file.is_image %}

                    <img src="/image/{{ file.name }}" class="mb-3">

                {% endif %}

                <div class="d-flex gap-2">

                    <a
                        href="/download/{{ file.name }}"
                        class="btn btn-success btn-sm"
                    >
                        Download
                    </a>

                    <a
                        href="/delete/{{ file.name }}"
                        class="btn btn-danger btn-sm"
                    >
                        Delete
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
